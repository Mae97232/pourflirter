<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages - Pourflirter</title>
  <link rel="stylesheet" href="Design/message.css" />
</head>
<body>

<header class="header">
  <div class="logo">
    💙
    <a href="accueil.html" style="text-decoration:none; color:inherit;">
      <span>Pourflirter</span>
    </a>
  </div>

  <div class="header-center">
    <div class="search-bar">
      <input type="text" placeholder="Recherche..." />
      <button type="button">🔍</button>
    </div>
  </div>

  <div class="header-actions">
    <div class="header-links">
      <a href="message.html">Messages</a>
      <a href="achat_credits.html">Crédits</a>
      <a href="#" id="logoutBtn">Déconnexion</a>
    </div>
    <div class="user-photo">
      <img
        src="images/utilisateur.jpg"
        alt="Ma photo"
        id="myAvatar"
        onerror="this.src='images/utilisateur.jpg'"
      />
    </div>
  </div>
</header>

<div class="layout">

  <aside class="conversations-list">
    <h3>Discussions</h3>
    <div id="conversationsList" style="padding:10px; opacity:.85;">
      Chargement des discussions...
    </div>
  </aside>

  <main class="messagerie">

    <div class="conversation-header">
      <div class="avatar">
        <img
          src="images/utilisateur.jpg"
          alt="Avatar"
          id="recipientAvatar"
          onerror="this.src='images/utilisateur.jpg'"
        />
      </div>
      <div class="pseudo">
        Discussion avec <strong id="recipientName">...</strong>
      </div>
    </div>

    <div
      id="debugBox"
      style="padding:10px; color:#b00020; font-size:14px; white-space:pre-wrap;"
    ></div>

    <div
      id="messagesContainer"
      style="display:flex; flex-direction:column; gap:10px; padding:10px; overflow-y:auto;"
    ></div>

    <form class="message-form" id="messageForm" autocomplete="off">
      <input
        id="messageInput"
        type="text"
        placeholder="Écris ton message..."
        required
      />
      <button id="sendBtn" type="submit">Envoyer pour 5 crédits</button>
    </form>

  </main>

  <aside class="sidebar-right">
    <a href="mes-photos.html">Mes Photos</a>
    <a href="profil.html">Mon Profil</a>
    <a href="mes-favoris.html">Mes Favoris</a>
    <a href="membres_bloques.html">Membres Bloqués</a>
    <a href="achat_credits.html">Acheter Crédits</a>
    <a href="parametre.html">Paramètres</a>
  </aside>

</div>

<footer class="footer">
  <a href="#">Service Clients</a>
  <a href="#">CGV</a>
  <a href="#">Protection des données</a>
  <a href="#">Mentions légales</a>
  <a href="#">EN / FR</a>
  © 2025 Pourflirter. Tous droits réservés.
</footer>

<script type="module">
  import { supabase } from "./supabaseClient.js";

  const DEFAULT_AVATAR = "images/utilisateur.jpg";
  const STORAGE_BUCKET = "photos"; // ⚠️ remplace par le vrai nom de ton bucket si besoin

  const debugBox = document.getElementById("debugBox");
  const recipientNameEl = document.getElementById("recipientName");
  const recipientAvatarEl = document.getElementById("recipientAvatar");
  const myAvatarEl = document.getElementById("myAvatar");
  const messagesContainer = document.getElementById("messagesContainer");
  const messageForm = document.getElementById("messageForm");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const conversationsList = document.getElementById("conversationsList");

  let myUserId = null;
  let recipientId = new URLSearchParams(window.location.search).get("to") || new URLSearchParams(window.location.search).get("user");
  let realtimeChannel = null;
  let loadedMessageIds = new Set();
  let currentConversationLoaded = false;

  function setError(msg, err = null) {
    console.error(msg, err || "");
    debugBox.style.color = "#b00020";
    debugBox.textContent = msg + (err?.message ? "\n" + err.message : "");
  }

  function setInfo(msg) {
    debugBox.style.color = "#666";
    debugBox.textContent = msg;
  }

  function clearError() {
    debugBox.textContent = "";
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (m) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[m]));
  }

  function getPhotoUrl(photoValue) {
    if (!photoValue || typeof photoValue !== "string") return DEFAULT_AVATAR;

    const value = photoValue.trim();
    if (!value) return DEFAULT_AVATAR;

    if (value.startsWith("http://") || value.startsWith("https://")) {
      return value;
    }

    if (
      value.startsWith("/") ||
      value.startsWith("./") ||
      value.startsWith("../") ||
      value.startsWith("images/")
    ) {
      return value;
    }

    const { data } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(value);
    return data?.publicUrl || DEFAULT_AVATAR;
  }

  function scrollMessagesToBottom(smooth = false) {
    requestAnimationFrame(() => {
      messagesContainer.scrollTo({
        top: messagesContainer.scrollHeight,
        behavior: smooth ? "smooth" : "auto"
      });
    });
  }

  function clearMessages() {
    messagesContainer.innerHTML = "";
    loadedMessageIds.clear();
  }

  function renderMessage(message, force = false) {
    if (!message) return;
    if (!force && message.id && loadedMessageIds.has(message.id)) return;

    const { id, content, created_at, sender_id } = message;
    const isMine = sender_id === myUserId;

    if (id) loadedMessageIds.add(id);

    const div = document.createElement("div");
    div.className = "message " + (isMine ? "sent" : "received");
    if (id) div.dataset.messageId = id;

    div.innerHTML = `
      <div>${escapeHtml(content)}</div>
      <time style="display:block; font-size:12px; opacity:.7; margin-top:4px;">
        ${created_at ? new Date(created_at).toLocaleTimeString("fr-FR", {
          hour: "2-digit",
          minute: "2-digit"
        }) : ""}
      </time>
    `;

    messagesContainer.appendChild(div);
  }

  async function requireSession() {
    const { data, error } = await supabase.auth.getSession();
    if (error) throw error;

    if (!data?.session) {
      window.location.href = "connexion.html";
      return null;
    }

    return data.session;
  }

  async function loadMyProfile() {
    const { data, error } = await supabase
      .from("profiles")
      .select("id, username, photo")
      .eq("id", myUserId)
      .maybeSingle();

    if (error) {
      console.warn("Profil utilisateur introuvable :", error.message);
      myAvatarEl.src = DEFAULT_AVATAR;
      return null;
    }

    if (data) {
      myAvatarEl.src = getPhotoUrl(data.photo);
      myAvatarEl.alt = data.username || "Moi";
    } else {
      myAvatarEl.src = DEFAULT_AVATAR;
    }

    return data;
  }

  async function loadRecipientProfile() {
    if (!recipientId) {
      recipientNameEl.textContent = "...";
      recipientAvatarEl.src = DEFAULT_AVATAR;
      return null;
    }

    const { data, error } = await supabase
      .from("profiles")
      .select("id, username, photo")
      .eq("id", recipientId)
      .maybeSingle();

    if (error || !data) {
      setError("Destinataire introuvable dans profiles.", error);
      recipientNameEl.textContent = "...";
      recipientAvatarEl.src = DEFAULT_AVATAR;
      return null;
    }

    recipientNameEl.textContent = data.username || "Utilisateur";
    recipientAvatarEl.src = getPhotoUrl(data.photo);
    recipientAvatarEl.alt = data.username || "Avatar";

    return data;
  }

  async function loadMessages({ autoScroll = false } = {}) {
    if (!recipientId || !myUserId) return;

    clearMessages();

    const { data, error } = await supabase
      .from("messages")
      .select("id, sender_id, receiver_id, content, created_at, read")
      .or(
        `and(sender_id.eq.${myUserId},receiver_id.eq.${recipientId}),and(sender_id.eq.${recipientId},receiver_id.eq.${myUserId})`
      )
      .order("created_at", { ascending: true });

    if (error) {
      setError("Chargement des messages impossible.", error);
      return;
    }

    (data || []).forEach((msg) => renderMessage(msg, true));

    if (autoScroll) {
      scrollMessagesToBottom(false);
    }
  }

  async function markMessagesAsRead() {
    if (!recipientId || !myUserId) return;

    const { error } = await supabase
      .from("messages")
      .update({ read: true })
      .eq("sender_id", recipientId)
      .eq("receiver_id", myUserId)
      .eq("read", false);

    if (error) {
      console.warn("Impossible de marquer comme lus :", error.message);
    }
  }

  async function sendMessage(text) {
    const cleanText = text.trim();
    if (!cleanText) return null;

    const { data, error } = await supabase
      .from("messages")
      .insert([
        {
          sender_id: myUserId,
          receiver_id: recipientId,
          content: cleanText
        }
      ])
      .select("id, sender_id, receiver_id, content, created_at, read")
      .single();

    if (error) {
      setError("Envoi impossible.", error);
      return null;
    }

    return data;
  }

  async function loadConversations() {
    if (!myUserId) return;

    const { data: allMessages, error } = await supabase
      .from("messages")
      .select("sender_id, receiver_id, created_at")
      .or(`sender_id.eq.${myUserId},receiver_id.eq.${myUserId}`)
      .order("created_at", { ascending: false });

    if (error) {
      conversationsList.innerHTML = `<div style="color:#b00020;">Impossible de charger les discussions.</div>`;
      return;
    }

    const uniqueUserIds = [];
    const seen = new Set();

    for (const msg of allMessages || []) {
      const otherUserId = msg.sender_id === myUserId ? msg.receiver_id : msg.sender_id;
      if (otherUserId && !seen.has(otherUserId)) {
        seen.add(otherUserId);
        uniqueUserIds.push(otherUserId);
      }
    }

    if (!uniqueUserIds.length) {
      conversationsList.innerHTML = `<div style="opacity:.7;">Aucune discussion pour le moment.</div>`;
      return;
    }

    const { data: profiles, error: profilesError } = await supabase
      .from("profiles")
      .select("id, username, photo")
      .in("id", uniqueUserIds);

    if (profilesError) {
      conversationsList.innerHTML = `<div style="color:#b00020;">Impossible de charger les profils des discussions.</div>`;
      return;
    }

    const profileMap = new Map((profiles || []).map((p) => [p.id, p]));

    conversationsList.innerHTML = uniqueUserIds.map((userId) => {
      const profile = profileMap.get(userId);
      const username = profile?.username || "Utilisateur";
      const avatar = getPhotoUrl(profile?.photo);
      const active = userId === recipientId;

      return `
        <a
          href="message.html?to=${encodeURIComponent(userId)}"
          data-user-id="${escapeHtml(userId)}"
          class="conversation-link"
          style="
            display:flex;
            align-items:center;
            gap:10px;
            padding:10px;
            margin-bottom:8px;
            border-radius:10px;
            text-decoration:none;
            color:#111;
            background:${active ? "#f0f4ff" : "#fff"};
            border:${active ? "1px solid #4a7cff" : "1px solid #e5e5e5"};
          "
        >
          <img
            src="${escapeHtml(avatar)}"
            alt="${escapeHtml(username)}"
            style="width:42px; height:42px; border-radius:50%; object-fit:cover; flex-shrink:0;"
            onerror="this.src='${DEFAULT_AVATAR}'"
          />
          <span style="font-weight:600;">${escapeHtml(username)}</span>
        </a>
      `;
    }).join("");
  }

  async function openConversation(userId, pushUrl = true) {
    if (!userId || userId === recipientId && currentConversationLoaded) return;

    recipientId = userId;
    currentConversationLoaded = false;
    clearError();
    setInfo("Chargement de la conversation...");

    if (pushUrl) {
      const url = new URL(window.location.href);
      url.searchParams.set("to", userId);
      window.history.pushState({}, "", url);
    }

    await loadConversations();

    const recipientProfile = await loadRecipientProfile();
    if (!recipientProfile) return;

    await loadMessages({ autoScroll: true });
    await markMessagesAsRead();
    clearError();
    currentConversationLoaded = true;
  }

  function subscribeToRealtime() {
    if (realtimeChannel) {
      supabase.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }

    realtimeChannel = supabase
      .channel("private-messages-room")
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        async (payload) => {
          const newMessage = payload.new;

          const isThisConversation =
            (newMessage.sender_id === myUserId && newMessage.receiver_id === recipientId) ||
            (newMessage.sender_id === recipientId && newMessage.receiver_id === myUserId);

          if (isThisConversation) {
            renderMessage(newMessage);
            scrollMessagesToBottom(true);
            await markMessagesAsRead();
          }

          await loadConversations();
        }
      )
      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "messages"
        },
        async () => {
          await loadConversations();
        }
      )
      .subscribe((status) => {
        console.log("Realtime status :", status);
      });
  }

  conversationsList.addEventListener("click", async (e) => {
    const link = e.target.closest(".conversation-link");
    if (!link) return;

    e.preventDefault();
    const userId = link.dataset.userId;
    await openConversation(userId, true);
  });

  messageForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();

    if (!recipientId) {
      setInfo("Sélectionne une discussion à gauche avant d'envoyer un message.");
      return;
    }

    const text = messageInput.value.trim();
    if (!text) return;

    sendBtn.disabled = true;

    const inserted = await sendMessage(text);

    if (inserted) {
      messageInput.value = "";
      renderMessage(inserted);
      scrollMessagesToBottom(true);
      await loadConversations();
    }

    sendBtn.disabled = false;
    messageInput.focus();
  });

  logoutBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = "connexion.html";
  });

  window.addEventListener("popstate", async () => {
    const params = new URLSearchParams(window.location.search);
    const newRecipientId = params.get("to") || params.get("user");

    if (!newRecipientId) {
      recipientId = null;
      clearMessages();
      recipientNameEl.textContent = "...";
      recipientAvatarEl.src = DEFAULT_AVATAR;
      setInfo("Sélectionne une discussion à gauche pour afficher les messages.");
      await loadConversations();
      return;
    }

    await openConversation(newRecipientId, false);
  });

  window.addEventListener("beforeunload", () => {
    if (realtimeChannel) {
      supabase.removeChannel(realtimeChannel);
    }
  });

  (async function init() {
    try {
      const session = await requireSession();
      if (!session) return;

      myUserId = session.user.id;

      await loadMyProfile();
      await loadConversations();
      subscribeToRealtime();

      if (!recipientId) {
        recipientNameEl.textContent = "...";
        recipientAvatarEl.src = DEFAULT_AVATAR;
        setInfo("Sélectionne une discussion à gauche pour afficher les messages.");
        return;
      }

      await openConversation(recipientId, false);
    } catch (e) {
      setError("Erreur lors de l'initialisation.", e);
    }
  })();
</script>

</body>
</html>
